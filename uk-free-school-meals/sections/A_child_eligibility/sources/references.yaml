# Citation manifest for the Free School Meals - child eligibility showcase.
# See provenance/README.md. Every quote is fetched, digested and matched
# verbatim by `uv run provenance/check_provenance.py`.

schema_version: 1

notes:
  - >-
    This showcase is the one case in the set where the underlying subject matter
    is real. Two kinds of document are therefore cited, and they are labelled
    differently on purpose. Where a criterion rests on a passage that exists
    verbatim in the published statute, the statute itself is cited, under the
    licence the publisher grants. Where a criterion rests on a threshold that
    the demonstration corpus states in its own words, the corpus document is
    cited as what it is - an Aethis-written extract prepared for this
    demonstration - and not dressed up as the instrument.
  - >-
    Consequence worth stating plainly: the two age thresholds are grounded in a
    demonstration document, not in a verbatim statutory passage. Anyone reading
    this ruleset as a statement of entitlement law should read the cited
    statute, not this corpus.

