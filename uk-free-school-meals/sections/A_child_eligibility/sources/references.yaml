# Citation keys are derived from source-document headings by the authoring
# pipeline (`<file>#<stem>/<heading>`, one key per heading), so each key below
# names a heading of an uploaded source. A key is a join key, not a location:
# the statute key is emitted from the verbatim extract the rules author reads
# (education_act_1996_s512zb.md) while its resolution target — what a visitor
# receives — is the published statute at legislation.gov.uk.
references:
  'education_act_1996_s512zb.md#education_act_1996_s512zb/Section 512ZB — Registered pupils in England':
    document: education-act-1996-s512zb
    locator: 'section 512ZB(4A)(a)'
    quote:
      exact: >-
        is a registered pupil at a maintained school or pupil referral unit in
        England

  'education_act_1996_s512.md#education_act_1996_s512/Section 512ZA — Prescribed descriptions of pupils':
    document: fsm-child-eligibility-corpus
    locator: 'Section 512ZA - Prescribed descriptions of pupils'
    quote:
      exact: >-
        Compulsory school age begins at the start of the term following a
        child's fifth birthday, but in practice the provision applies from the
        start of the Reception year (age 4–5).

        **Relevant school** means—
        (a) a school maintained by a local authority in England;
        (b) an Academy;
        (c) a non-maintained special school;
        (d) a pupil referral unit.

        Independent schools (fee-paying) and home-educated children are not
        within scope of this provision.

  'fsm_regulations_2014_reg3.md#fsm_regulations_2014_reg3/Regulation 3 — Persons who are entitled to free school lunches':
    document: fsm-entitlement-corpus
    locator: 'Regulation 3(1)'
    quote:
      exact: >-
        A person is entitled to a free school lunch if the person is a registered
        pupil at a relevant school in England and is aged under 16

criteria:
  school_type_state_funded:
    - 'education_act_1996_s512zb.md#education_act_1996_s512zb/Section 512ZB — Registered pupils in England'
    - 'education_act_1996_s512.md#education_act_1996_s512/Section 512ZA — Prescribed descriptions of pupils'
  age_at_least_4:
    - 'education_act_1996_s512.md#education_act_1996_s512/Section 512ZA — Prescribed descriptions of pupils'
  age_under_16:
    - 'fsm_regulations_2014_reg3.md#fsm_regulations_2014_reg3/Regulation 3 — Persons who are entitled to free school lunches'
