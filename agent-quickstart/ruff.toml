# Lint settings for the agent quickstart only, so "ruff check is clean" is a
# reproducible claim rather than a statement about whichever ruff version and
# default rule set happened to be installed. The rest of the repo predates this
# and is unaffected: ruff applies the nearest config to each file.
#
# Reproduce with:  uvx ruff@0.16.0 check agent-quickstart
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
