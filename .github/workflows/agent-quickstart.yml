# Lint + smoke tests for the agent quickstart.
#
# Deliberately offline: no Aethis credential, no model-provider key, no network
# calls to the evaluator. Everything the tests need is recorded under
# agent-quickstart/fixtures/. A live run against the evaluator is a release
# activity, not a per-PR one.
name: agent-quickstart

on:
  pull_request:
    paths:
      - 'agent-quickstart/**'
      - 'run_tests.py'
      - 'test_all.py'
      - 'scenario_manifest.py'
      - 'input_identity.py'
      - 'tests/**'
      - '**/aethis.yaml'
      - '**/tests/scenarios.yaml'
      - '**/rulebook.yaml'
      - '**/snapshots/*.json'
      - 'spacecraft-crew-certification/retained/**'
      - '.github/workflows/agent-quickstart.yml'
  push:
    branches: [main]
    paths:
      - 'agent-quickstart/**'
      - 'run_tests.py'
      - 'test_all.py'
      - 'scenario_manifest.py'
      - 'input_identity.py'
      - 'tests/**'
      - '**/aethis.yaml'
      - '**/tests/scenarios.yaml'
      - '**/rulebook.yaml'
      - '**/snapshots/*.json'
      - 'spacecraft-crew-certification/retained/**'
      - '.github/workflows/agent-quickstart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.5'

      - name: Lint
        run: uvx ruff@0.16.0 check agent-quickstart

      - name: Smoke tests
        env:
          # Prove the suite needs no credentials: nothing is provided, and the
          # tests themselves scrub any AETHIS_*/ANTHROPIC_* that leaked in.
          AETHIS_API_KEY: ''
          ANTHROPIC_API_KEY: ''
        run: uv run agent-quickstart/smoke_test.py

      - name: Offline runner and vocabulary controls
        run: uv run --with pyyaml --with rich --with requests --with rfc8785==0.1.4 python -m unittest discover -s tests -p 'test_*.py'
